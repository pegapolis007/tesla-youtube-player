<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tesla TV — Drive Mode</title>
<style>
  :root{
    --bg:#0a0b0e; --card:#141720; --card2:#1c2029; --text:#e6e8ec;
    --muted:#8a9098; --red:#ff2050; --green:#00d084; --amber:#f5a623;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    touch-action:manipulation;overflow-x:hidden;}
  header{padding:18px 18px 10px;display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  h1{font-size:22px;font-weight:800;margin:0;letter-spacing:.3px;white-space:nowrap;}
  h1 b{color:var(--red);}
  .status{font-size:13px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:8px;}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex-shrink:0;}
  .dot.drive{background:var(--amber);animation:pulse 1.2s infinite;}
  .dot.off{background:var(--red);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .search{margin:12px 18px;display:flex;gap:8px;}
  .search input{flex:1;background:var(--card2);border:1px solid #262a34;color:var(--text);
    border-radius:12px;padding:14px 16px;font-size:17px;outline:none;}
  .search input:focus{border-color:var(--red);}
  .search input::placeholder{color:var(--muted);}
  .search button{background:var(--red);border:none;color:#fff;border-radius:12px;
    padding:14px 22px;font-size:17px;font-weight:700;cursor:pointer;}
  .search button:active{transform:scale(.95);}
  #playerArea{margin:14px 18px;background:#000;border-radius:var(--radius);overflow:hidden;position:relative;}
  #ytplayer{width:100%;aspect-ratio:16/9;display:block;}
  .drive-badge{display:none;background:var(--amber);color:#000;border-radius:8px;padding:8px 14px;
    font-size:13px;font-weight:700;position:absolute;top:10px;right:10px;z-index:5;
    box-shadow:0 2px 12px rgba(0,0,0,.5);}
  .drive-badge.show{display:block;}
  .info{padding:12px 18px 0;font-size:15px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .controls{display:flex;align-items:center;gap:10px;padding:8px 18px 16px;flex-wrap:wrap;}
  .controls button{background:var(--card2);border:1px solid #262a34;color:var(--text);
    border-radius:10px;padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer;}
  .controls button:active{transform:scale(.95);}
  .controls .sep{flex:1;}
  .seek-wrap{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);flex:1;min-width:180px;}
  .seek-wrap input[type=range]{flex:1;accent-color:var(--red);height:6px;}
  .fav{margin:0 18px 20px;}
  .fav-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
  .fav-list{display:flex;flex-wrap:wrap;gap:8px;}
  .fav-list a{background:var(--card2);border:1px solid #262a34;color:var(--text);
    border-radius:999px;padding:10px 14px;font-size:14px;font-weight:600;text-decoration:none;}
  .fav-list a:active{transform:scale(.96);background:var(--red);}
  .add-fav{display:flex;gap:8px;padding:0 18px 20px;}
  .add-fav input{flex:1;background:var(--card2);border:1px solid #262a34;color:var(--text);
    border-radius:10px;padding:12px 14px;font-size:15px;outline:none;}
  .add-fav input::placeholder{color:var(--muted);}
  .add-fav button{background:var(--red);border:none;color:#fff;border-radius:10px;
    padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;}
  .add-fav button:active{transform:scale(.95);}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
    background:#1e222a;color:var(--text);border:1px solid #2c313a;border-radius:12px;
    padding:12px 20px;font-size:15px;font-weight:600;z-index:100;
    box-shadow:0 8px 24px rgba(0,0,0,.6);opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <h1>Tesla <b>TV</b></h1>
  <div class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">Park — video oynuyor</span></div>
</header>

<div class="search">
  <input id="urlIn" type="text" inputmode="url" placeholder="YouTube linki, video ID veya arama yaz...">
  <button id="playBtn">▶ Oynat</button>
</div>

<div id="playerArea">
  <div id="ytplayer"></div>
  <div class="drive-badge" id="driveBadge">🚗 SÜRÜŞ MODU — SES DEVAM</div>
</div>

<div class="info" id="vidTitle">Bir video linki yapıştır veya arama yaz</div>

<div class="controls">
  <button id="prevBtn">◀ Önceki</button>
  <div class="seek-wrap">
    <span id="curTime">0:00</span>
    <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
    <span id="durTime">0:00</span>
  </div>
  <button id="nextBtn">Sonraki ▶</button>
  <div class="sep"></div>
  <button id="muteBtn">🔊</button>
  <button id="qualityBtn">720p</button>
</div>

<div class="fav">
  <div class="fav-title">Son oynatılanlar</div>
  <div class="fav-list" id="lastList"></div>
</div>

<div class="add-fav">
  <input id="favIn" type="url" placeholder="Link ekle → favorilere ekle">
  <button id="favBtn">Ekle</button>
</div>

<div class="toast" id="toast"></div>

<!-- YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>
<!-- Uygulama JS -->
<script src="app.js"></script>
</body>
</html>
