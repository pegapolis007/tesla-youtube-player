<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tesla YouTube — Araç İçi İzleme</title>
<meta name="theme-color" content="#0a0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a14;--surface:#12121f;--line:#222238;--text:#e4e4ef;--muted:#7777a0;--accent:#6366f1;--accent2:#818cf8;--radius:14px}
html,body{height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;overflow-x:hidden}

hdr{position:sticky;top:0;z-index:60;background:rgba(10,10,20,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 20px}
hdr .logo{font-size:1.15rem;font-weight:700;color:var(--accent2)}
hdr .logo span{background:linear-gradient(135deg,#6366f1,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
hdr nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
hdr nav a{text-decoration:none;color:var(--muted);font-size:.82rem;padding:6px 12px;border-radius:8px;transition:.2s}
hdr nav a:hover,hdr nav a.active{background:var(--surface);color:var(--text)}

main{max-width:1280px;margin:0 auto;padding:16px}
section{margin-bottom:32px}
section h2{font-size:1.05rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
section h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}

.ch-grid{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.ch-grid::-webkit-scrollbar{display:none}
.ch-card{flex:0 0 160px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:.2s;text-decoration:none;display:flex;flex-direction:column;gap:8px}
.ch-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.ch-card .avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a78bfa);display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700;color:#fff}
.ch-card .name{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-card .sub{font-size:.72rem;color:var(--muted)}

.v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.v-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.2s}
.v-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.v-card .thumb{width:100%;aspect-ratio:16/9;background:#000;position:relative;overflow:hidden}
.v-card .thumb img{width:100%;height:100%;object-fit:cover}
.v-card .thumb .play-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);opacity:0;transition:.2s;font-size:2.5rem}
.v-card:hover .play-icon{opacity:1}
.v-card .meta{padding:12px 14px}
.v-card .meta .title{font-size:.88rem;font-weight:600;line-height:1.35;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.v-card .meta .channel{font-size:.75rem;color:var(--muted)}

.player-overlay{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.97);display:none;flex-direction:column}
.player-overlay.open{display:flex}
.player-bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#000;border-bottom:1px solid var(--line);flex-shrink:0}
.player-bar .back-btn{background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;padding:6px 10px;border-radius:8px}
.player-bar .back-btn:hover{background:rgba(255,255,255,.1)}
.player-bar .vid-title{font-size:.88rem;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.player-bar .vid-title span{color:var(--text)}
.player-frame-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;background:#000}
.player-frame-wrap iframe{width:100%;height:100%;border:none}

.search-wrap{padding:12px 20px}
.search-wrap input{width:100%;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:.9rem;outline:none}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--muted)}

@media(max-width:640px){
  hdr{padding:10px 12px;gap:8px}
  hdr nav a{padding:5px 8px;font-size:.75rem}
  .ch-card{flex:0 0 140px;padding:12px}
  .v-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="logo"><span>Tesla</span> YouTube</div>
  <nav>
    <a href="#" onclick="showSection('home');return false" class="active" id="nav-home">Ana Sayfa</a>
    <a href="#" onclick="showSection('trending');return false" id="nav-trending">Trend</a>
    <a href="#" onclick="showSection('favorites');return false" id="nav-favorites">Favoriler</a>
  </nav>
</header>

<div class="search-wrap">
  <input type="text" id="searchInput" placeholder="YouTube'da ara..." oninput="handleSearch(this.value)">
</div>

<main>
  <section id="sec-home">
    <h2><span class="dot"></span>Kanal Önerileri</h2>
    <div class="ch-grid" id="chGrid"></div>
  </section>

  <section id="sec-trending" style="display:none">
    <h2><span class="dot"></span>Trend Videolar</h2>
    <div class="v-grid" id="trendGrid"></div>
  </section>

  <section id="sec-favorites" style="display:none">
    <h2><span class="dot"></span>Favoriler</h2>
    <div class="v-grid" id="favGrid"></div>
  </section>

  <section id="sec-search" style="display:none">
    <h2><span class="dot"></span>Arama Sonuçları</h2>
    <div class="v-grid" id="searchGrid"></div>
  </section>
</main>

<div class="player-overlay" id="playerOverlay">
  <div class="player-bar">
    <button class="back-btn" onclick="closePlayer()">&#8592;</button>
    <div class="vid-title" id="playerTitle"><span></span></div>
    <button class="back-btn" onclick="toggleFullscreen()">&#x26F6;</button>
  </div>
  <div class="player-frame-wrap">
    <div id="playerContainer"></div>
  </div>
</div>

<script>
const isTesla = /Tesla|QtCarBrowser/i.test(navigator.userAgent);
const channels = [
  {id:'UC711211901627172841',name:'Trend TR',subs:'TV & Medya'},
  {id:'UCvB4TIaIIGOxWeTJVRFDgVA',name:'YouTube Trend',subs:'YouTube'},
  {id:'UCqK-G1yfCIPe4qiNhF30kXG',name:'TRT',subs:'Kanal'},
  {id:'UC16NI4r26EbfmxgCVVjKjMg',name:'Nickelodeon',subs:'Çocuk'},
  {id:'UC2M_8GfI2f92r0MxPkhqCTQ',name:'Yemek Tarifleri',subs:'Yemek'},
  {id:'UC6107mQKpGLuiQJGAoRdWFA',name:'Müzik',subs:'Müzik'},
  {id:'UCt2KpvpEnxf2r1aqybMv4eA',name:'Doğa',subs:'Doğa'},
  {id:'UCJ0OxJEBV83BfE8qMlN3XqQ',name:'Sürüş',subs:'Otomobil'},
];
const videos = [
  {id:'dQw4w9WgXcQ',title:'Rick Astley - Never Gonna Give You Up',channel:'Rick Astley'},
  {id:'9bZkp7q19f0',title:'PSY - GANGNAM STYLE',channel:'officialpsy'},
  {id:'kJQP7kiw5Fk',title:'Luis Fonsi - Despacito',channel:'Luis Fonsi'},
  {id:'fJ9rUzIMcZQ',title:'Queen - Bohemian Rhapsody',channel:'Queen Official'},
  {id:'OPf0YbXqDm0',title:'Mark Ronson - Uptown Funk',channel:'Mark Ronson'},
  {id:'60ItHLz5WEA',title:'Alan Walker - Faded',channel:'Alan Walker'},
  {id:'JGwWNGJdvx8',title:'Ed Sheeran - Shape of You',channel:'Ed Sheeran'},
  {id:'YQHsXMglC9A',title:'Adele - Hello',channel:'Adele'},
  {id:'CevxZvSJLk8',title:'Katy Perry - Roar',channel:'Katy Perry'},
  {id:'RgKAFK5djSk',title:'Wiz Khalifa - See You Again',channel:'Wiz Khalifa'},
];
const trendingVideos = [
  {id:'dQw4w9WgXcQ',title:'Rick Astley - Never Gonna Give You Up',channel:'Rick Astley'},
  {id:'kJQP7kiw5Fk',title:'Luis Fonsi - Despacito',channel:'Luis Fonsi'},
  {id:'60ItHLz5WEA',title:'Alan Walker - Faded',channel:'Alan Walker'},
  {id:'JGwWNGJdvx8',title:'Ed Sheeran - Shape of You',channel:'Ed Sheeran'},
  {id:'YQHsXMglC9A',title:'Adele - Hello',channel:'Adele'},
  {id:'OPf0YbXqDm0',title:'Mark Ronson - Uptown Funk',channel:'Mark Ronson'},
  {id:'fJ9rUzIMcZQ',title:'Queen - Bohemian Rhapsody',channel:'Queen Official'},
  {id:'RgKAFK5djSk',title:'Wiz Khalifa - See You Again',channel:'Wiz Khalifa'},
  {id:'9bZkp7q19f0',title:'PSY - GANGNAM STYLE',channel:'officialpsy'},
  {id:'CevxZvSJLk8',title:'Katy Perry - Roar',channel:'Katy Perry'},
  {id:'YBkzzU8M77U',title:'Istanbul 4K Walking Tour',channel:'Rambalac'},
  {id:'nFbCJix_1_8',title:'Ankara 4K City Walk',channel:'Travel Guide'},
  {id:'x2lRq2FfMqE',title:'Bodrum 4K Drone Footage',channel:'Dronemasters'},
  {id:'nPt7z0d63kU',title:'Tesla Cybertruck FSD Demo',channel:'Tesla'},
  {id:'dNJdJIwCF_Y',title:'Cybertruck Off-Road',channel:'Tesla'},
];
function getFavs(){try{return JSON.parse(localStorage.getItem('tesla_yt_favs')||'[]')}catch(e){return[]}}
function toggleFav(id){let f=getFavs();const i=f.indexOf(id);if(i>=0)f.splice(i,1);else f.unshift(id);localStorage.setItem('tesla_yt_favs',JSON.stringify(f));if(document.getElementById('sec-favorites').style.display!=='none')renderFavorites()}
function renderChannels(){document.getElementById('chGrid').innerHTML=channels.map(ch=>`<a class="ch-card" href="https://www.youtube.com/channel/${ch.id}" target="_blank"><div class="avatar">${ch.name.charAt(0)}</div><div><div class="name">${ch.name}</div><div class="sub">${ch.subs}</div></div></a>`).join('');}
function renderCards(cid,vids){document.getElementById(cid).innerHTML=vids.map(v=>`<div class="v-card" onclick="openPlayer('${v.id}','${v.title.replace(/'/g,"\\'")}','${v.channel.replace(/'/g,"\\'")}')" oncontextmenu="event.preventDefault();toggleFav('${v.id}');return false"><div class="thumb"><img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt="" loading="lazy"><div class="play-icon">&#9654;</div></div><div class="meta"><div class="title">${v.title}</div><div class="channel">${v.channel}</div></div></div>`).join('');}

// ════════════════════════════════════════
// TESLA DRIVE-MODE: YT IFrame API
// YT Player ile video oynat, onStateChange PAUSED→playVideo()
// Backup her 100ms playVideo() — viteste video durmaz
// Gizli audio: ses pipeline açık
// ════════════════════════════════════════
let ytPlayer = null;
let ytApiReady = false;
let backupTimer = null;

function loadYTApi(){
  return new Promise(function(resolve){
    if(window.YT && window.YT.Player){ytApiReady=true;resolve();return}
    if(ytApiReady){resolve();return}
    var tag=document.createElement('script');
    tag.src='https://www.youtube.com/iframe_api';
    var first=document.getElementsByTagName('script')[0];
    first.parentNode.insertBefore(tag,first);
    window.onYouTubeIframeAPIReady=function(){ytApiReady=true;resolve()};
    setTimeout(resolve,3000);
  });
}

function openPlayer(videoId,title,channel){
  document.getElementById('playerOverlay').classList.add('open');
  document.getElementById('playerTitle').innerHTML='<span>'+channel+'</span> — '+title;
  document.getElementById('playerContainer').innerHTML='';
  loadYTApi().then(function(){createPlayer(videoId)});
}

function createPlayer(videoId){
  var container = document.getElementById('playerContainer');
  if(isTesla){
    var audio=document.createElement('audio');
    audio.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
    audio.loop=true;audio.volume=0;
    container.appendChild(audio);
    audio.play().catch(function(){});
  }
  var playerDiv=document.createElement('div');
  playerDiv.id='yt-player';
  container.appendChild(playerDiv);
  ytPlayer = new YT.Player('yt-player',{
    height:'100%',width:'100%',videoId:videoId,
    playerVars:{autoplay:1,modestbranding:1,rel:0,playsinline:1,controls:1,start:0,origin:location.origin},
    events:{
      onReady:function(event){event.target.setVolume(100)},
      onStateChange:function(event){
        if(event.data===2) ytPlayer.playVideo();
      }
    }
  });
  if(isTesla){
    // Her 50ms'de playVideo — Tesla'nın pause'unu override et
    backupTimer=setInterval(function(){
      try{
        if(ytPlayer&&ytPlayer.getPlayerState){
          var s = ytPlayer.getPlayerState();
          if(s===2||s===3) ytPlayer.playVideo();
        }
      }catch(e){}
    },50);
    // Ayrıca iframe'in internal video elementine de play() gönder
    (function tryInternalPlay(){
      setTimeout(function(){
        try{
          var iframe = document.querySelector('#yt-player iframe');
          if(iframe && iframe.contentDocument){
            var vid = iframe.contentDocument.querySelector('video');
            if(vid) vid.play().catch(function(){});
          }
        }catch(e){}
        tryInternalPlay();
      },200);
    })();
  }
}

function closePlayer(){
  document.getElementById('playerOverlay').classList.remove('open');
  document.getElementById('playerContainer').innerHTML='';
  if(ytPlayer){ytPlayer.destroy();ytPlayer=null}
  if(backupTimer){clearInterval(backupTimer);backupTimer=null}
}

function toggleFullscreen(){
  if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(function(){});
  else document.exitFullscreen();
}

function showSection(name){
  document.querySelectorAll('main>section').forEach(function(s){s.style.display='none'});
  document.querySelectorAll('hdr nav a').forEach(function(a){a.classList.remove('active')});
  if(name==='home'){document.getElementById('sec-home').style.display='block';renderChannels();document.getElementById('nav-home').classList.add('active')}
  else if(name==='trending'){document.getElementById('sec-trending').style.display='block';renderCards('trendGrid',trendingVideos);document.getElementById('nav-trending').classList.add('active')}
  else if(name==='favorites'){document.getElementById('sec-favorites').style.display='block';renderFavorites();document.getElementById('nav-favorites').classList.add('active')}
}

function renderFavorites(){
  var favs=getFavs();var grid=document.getElementById('favGrid');
  if(favs.length===0){grid.innerHTML='<p style="color:var(--muted);padding:20px">Henüz favori yok. Bir videoya uzun bas (sağ tık).</p>';return}
  var favVids=trendingVideos.filter(function(v){return favs.includes(v.id)});
  if(favVids.length===0){grid.innerHTML='<p style="color:var(--muted);padding:20px">Henüz favori yok. Bir videoya uzun bas (sağ tık).</p>';return}
  renderCards('favGrid',favVids);
}

function handleSearch(q){
  var sec=document.getElementById('sec-search');
  if(q.length<2){sec.style.display='none';return}
  sec.style.display='block';
  var q2=q.toLowerCase();
  var r=[].concat(videos,trendingVideos).filter(function(v){return v.title.toLowerCase().includes(q2)||v.channel.toLowerCase().includes(q2)});
  renderCards('searchGrid',r);
}

renderChannels();
renderCards('trendGrid',trendingVideos);
</script>
</body>
</html>
